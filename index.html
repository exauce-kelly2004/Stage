<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts/config.js" defer></script>
    <script src="scripts/script.js" defer></script>
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <h1>AzerType</h1>
        <h2>L'application pour écrire plus vite </h2>
        <h3>AzerType est une application en ligne pour apprendre à taper plus vite au clavier </h3>
    </header>

     <!--main-->
    <main>
        <div class="zoneOption">
            <p>Choisissez votre option et taper la proposition qui s'affiche dans le champ en dessous</p>
            <div class="option">
                <input type="radio" id="option1" name="option">
                <label for="mot">mots</label>
                <input type="radio" id="option2" name="option">
                <label for="Phrases">Phrases</label>
            </div>
        </div>

        <div class="zoneProposition">
            Azertype
        </div>

        <div class="zoneSaisie">
            <input type="text" id="inputEcriture" placeholder="Tapez ici">
            <button id="BtnValiderMot">Valider</button>
        </div>

        <div class="zoneScore">
            Votre score : <span id="score">0</span>
        </div>
    </main>
</body>
</html>
